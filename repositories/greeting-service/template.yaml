AWSTemplateFormatVersion: "2010-09-09"
Description: Configuration of the greeting service

Parameters:
  SessionId:
    Type: String
    Description: The deployment broker sets this value. Do not change this parameter.

Resources:
  Greeting:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/agentfarm/${SessionId}/greeting"
      Type: String
      Value: "Hello"
